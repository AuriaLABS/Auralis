name: E1.7 Eval Profile BEFORE

on:
  pull_request:
    paths:
      - '.github/workflows/e1-7-eval-profile-before.yml'

jobs:
  profile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Eval allocation baseline
        run: cargo run --release --bin auralis_eval_profile -- 20
