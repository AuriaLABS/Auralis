name: Multimodal Eval Suite

on:
  pull_request:
    paths:
      - "src/mm_eval.rs"
      - "src/lib.rs"
      - "src/docs_check.rs"
      - "docs/mm-eval.md"
      - "docs/versions.md"
      - ".github/workflows/mm_eval.yml"

permissions:
  contents: read

jobs:
  mm-eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Multimodal eval contracts
        run: cargo test --lib mm_eval::tests -- --nocapture

      - name: Documentation contract
        run: cargo test --lib docs_check::tests::mm_eval_doc_matches_contract -- --nocapture

      - name: Full suite
        run: cargo test --lib
