name: E2 Matmul Candidate

on:
  pull_request:
    paths:
      - 'src/cpu_matmul.rs'
      - 'src/bin/auralis_matmul_blocked_bench.rs'
      - '.github/workflows/e2-matmul-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Correctness smoke
        run: cargo test --lib cpu_matmul::tests -- --nocapture

      - name: Side-by-side candidate benchmark
        shell: bash
        run: |
          set -euo pipefail
          output="$(cargo run --release --bin auralis_matmul_blocked_bench -- 5 80 7 32 2>&1)"
          printf '%s\n' "$output" | tee /tmp/e2-matmul-candidate.txt
          test "$(grep -c '^shape=' /tmp/e2-matmul-candidate.txt)" -eq 4
          awk '
            /^shape=/ {
              shape=""; ratio="";
              for (i=1; i<=NF; i++) {
                split($i, a, "=");
                if (a[1] == "shape") shape=a[2];
                if (a[1] == "candidate_over_reference") ratio=a[2];
              }
              if (shape == "" || ratio == "") exit 2;
              printf "e2_matmul_result | shape=%s candidate_over_reference=%s\n", shape, ratio;
            }
          ' /tmp/e2-matmul-candidate.txt

      - name: Publish benchmark summary
        if: always()
        shell: bash
        run: |
          if test -s /tmp/e2-matmul-candidate.txt; then
            {
              echo '## E2 matmul candidate'
              echo
              echo 'Lower `candidate_over_reference` is better; `< 1.0` means candidate is faster.'
              echo
              echo '```text'
              grep '^shape=' /tmp/e2-matmul-candidate.txt || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
