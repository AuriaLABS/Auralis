name: Training Diagnostics Comparison

on:
  pull_request:
    paths:
      - "src/training.rs"
      - "src/numeric.rs"
      - "src/numeric_state.rs"
      - "src/bin/auralis_training_diagnostics_bench.rs"
      - ".github/workflows/training_diagnostics_comparison.yml"

jobs:
  compare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run clean-state equivalence and overhead benchmark
        shell: bash
        run: |
          set -euo pipefail
          cargo run --release --bin auralis_training_diagnostics_bench -- 8 5 | tee /tmp/diagnostics.txt
          python3 - <<'PY'
          import math
          import re

          text = open("/tmp/diagnostics.txt", encoding="utf-8").read()
          m = re.search(
              r"training_diagnostics_bench \| steps=(\d+) repeats=(\d+) "
              r"baseline_ns_per_step=([0-9.]+) diagnostics_ns_per_step=([0-9.]+) "
              r"diagnostics_over_baseline=([0-9.]+)",
              text,
          )
          if not m:
              raise SystemExit("missing training diagnostics benchmark record")
          steps, repeats, baseline, diagnostics, ratio = m.groups()
          baseline = float(baseline)
          diagnostics = float(diagnostics)
          ratio = float(ratio)
          if int(steps) <= 0 or int(repeats) <= 0:
              raise SystemExit("invalid benchmark protocol")
          if not all(math.isfinite(x) and x > 0 for x in [baseline, diagnostics, ratio]):
              raise SystemExit("invalid benchmark measurements")
          print(
              "training_diagnostics_compare | "
              f"baseline_ns_per_step={baseline:.3f} "
              f"diagnostics_ns_per_step={diagnostics:.3f} "
              f"diagnostics_over_baseline={ratio:.4f}"
          )
          PY
