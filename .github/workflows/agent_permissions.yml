name: Agent Permissions Sandbox

on:
  pull_request:
    paths:
      - "src/agent_permissions.rs"
      - "src/tool_protocol.rs"
      - "src/agent_eval.rs"
      - "src/lib.rs"
      - "src/docs_check.rs"
      - "docs/agent-permissions.md"
      - "docs/tool-protocol.md"
      - "docs/versions.md"
      - "README.md"
      - ".github/workflows/agent_permissions.yml"

permissions:
  contents: read

jobs:
  permissions:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Permission runtime contract
        run: |
          cargo test --lib agent_permissions::tests -- --nocapture
          cargo test --lib tool_protocol::tests -- --nocapture
          cargo test --lib docs_check::tests::agent_permissions_doc_matches_contract -- --nocapture
          cargo test --lib docs_check::tests::documented_versions_match_code -- --nocapture

      - name: Agent replay compatibility
        run: |
          cargo test --lib agent_eval::tests -- --nocapture

      - name: Full suite
        run: cargo test --all-targets
