name: Agent Session

on:
  pull_request:
    paths:
      - "src/session.rs"
      - "src/agent.rs"
      - "src/agent_eval.rs"
      - "src/lib.rs"
      - "src/docs_check.rs"
      - "docs/session.md"
      - "docs/versions.md"
      - ".github/workflows/agent_session.yml"

permissions:
  contents: read

jobs:
  session:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Session contracts
        run: cargo test --lib session::tests -- --nocapture

      - name: Documentation contract
        run: cargo test --lib docs_check::tests::session_doc_matches_contract -- --nocapture

      - name: Full suite
        run: cargo test --lib
