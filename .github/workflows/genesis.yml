name: Auralis CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: auralis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AURALIS_COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Unit and acceptance tests
        run: cargo test --all-targets

      - name: Gradient check CLI
        shell: bash
        run: |
          output="$(cargo run --release -- check 2>&1)"
          printf '%s\n' "$output"
          grep -q 'ok=true' <<< "$output"

      - name: BPE roundtrip
        run: cargo run --release -- bpe

      - name: Training, accumulation, manifest and checkpoint smoke test
        shell: bash
        run: |
          output="$(cargo run --release -- train-fresh 3 /tmp/auralis-foundation.bin 659918 2 2 2>&1)"
          printf '%s\n' "$output"
          grep -q 'run_summary |' <<< "$output"
          grep -q 'effective_batch=4' <<< "$output"

          test -s /tmp/auralis-foundation.bin
          test -s /tmp/auralis-foundation.bin.manifest
          grep -q 'auralis_manifest=4' /tmp/auralis-foundation.bin.manifest
          grep -q "code_revision=${AURALIS_COMMIT_SHA}" /tmp/auralis-foundation.bin.manifest
          grep -q 'seed=659918' /tmp/auralis-foundation.bin.manifest
          grep -q 'batch_size=2' /tmp/auralis-foundation.bin.manifest
          grep -q 'gradient_accumulation_steps=2' /tmp/auralis-foundation.bin.manifest
          grep -q 'run_config_schema=1' /tmp/auralis-foundation.bin.manifest
          grep -q 'run_config_fingerprint=' /tmp/auralis-foundation.bin.manifest

          before="$(sha256sum /tmp/auralis-foundation.bin | cut -d' ' -f1)"
          if cargo run --release -- train 1 /tmp/auralis-foundation.bin 123 2 2; then
            echo 'resume with a different seed unexpectedly succeeded'
            exit 1
          fi
          after="$(sha256sum /tmp/auralis-foundation.bin | cut -d' ' -f1)"
          test "$before" = "$after"

          if cargo run --release -- train 1 /tmp/auralis-foundation.bin 659918 2 1; then
            echo 'resume with different accumulation unexpectedly succeeded'
            exit 1
          fi
          after_accum="$(sha256sum /tmp/auralis-foundation.bin | cut -d' ' -f1)"
          test "$before" = "$after_accum"

          cp /tmp/auralis-foundation.bin.manifest /tmp/auralis-foundation.saved.manifest
          rm /tmp/auralis-foundation.bin.manifest
          if cargo run --release -- train 1 /tmp/auralis-foundation.bin 659918 2 2; then
            echo 'resume without Foundation manifest unexpectedly succeeded'
            exit 1
          fi
          after_missing_manifest="$(sha256sum /tmp/auralis-foundation.bin | cut -d' ' -f1)"
          test "$before" = "$after_missing_manifest"
          mv /tmp/auralis-foundation.saved.manifest /tmp/auralis-foundation.bin.manifest

          cargo run --release -- train 1 /tmp/auralis-foundation.bin 659918 2 2
          test -s /tmp/auralis-foundation.bin.manifest
          cargo run --release -- eval /tmp/auralis-foundation.bin

      - name: Foundation CPU regression benchmark
        shell: bash
        run: |
          cargo build --release
          bash scripts/foundation_benchmark.sh

      - name: Engine allocation profile smoke test
        shell: bash
        run: |
          output="$(cargo run --release --features alloc-profile --bin auralis-profile -- 2 2>&1)"
          printf '%s\n' "$output"
          grep -q '^engine_profile | mode=reference ' <<< "$output"
          grep -q '^engine_profile | mode=reuse ' <<< "$output"
          delta="$(grep '^engine_profile_delta |' <<< "$output")"
          grep -q 'exact_state=true' <<< "$delta"
          reduction="$(awk '{ for (i = 1; i <= NF; i++) { split($i, a, "="); if (a[1] == "alloc_bytes_reduction_pct") { print a[2]; exit } } }' <<< "$delta")"
          awk -v reduction="$reduction" 'BEGIN { exit !(reduction > 0.0) }'

      - name: Engine side-by-side throughput benchmark
        shell: bash
        run: |
          output="$(cargo run --release --bin auralis_engine_bench -- 3 20 5 2>&1)"
          printf '%s\n' "$output"
          test "$(grep -c '^engine_bench_run |' <<< "$output")" -eq 5
          summary="$(grep '^engine_bench_summary |' <<< "$output")"
          grep -q 'exact_state=true' <<< "$summary"
          grep -q 'repeats=5' <<< "$summary"

      - name: E2 grad-B kernel benchmark
        shell: bash
        run: |
          output="$(cargo run --release --bin auralis_kernel_bench -- 5 40 5 2>&1)"
          printf '%s\n' "$output"
          test "$(grep -c '^kernel_bench_run |' <<< "$output")" -eq 5
          summary="$(grep '^kernel_bench_summary |' <<< "$output")"
          grep -q 'kernel=matmul_grad_b' <<< "$summary"
          grep -q 'exact_output=true' <<< "$summary"
          grep -q 'repeats=5' <<< "$summary"

      - name: E2 forward matmul benchmark
        shell: bash
        run: |
          output="$(cargo run --release --bin auralis_matmul_bench -- 5 40 5 2>&1)"
          printf '%s\n' "$output"
          test "$(grep -c '^matmul_bench_run |' <<< "$output")" -eq 5
          summary="$(grep '^matmul_bench_summary |' <<< "$output")"
          grep -q 'exact_output=true' <<< "$summary"
          grep -q 'repeats=5' <<< "$summary"

      - name: E2 B-transpose matmul benchmark
        shell: bash
        run: |
          output="$(cargo run --release --bin auralis_matmul_bt_bench -- 5 40 5 2>&1)"
          printf '%s\n' "$output"
          test "$(grep -c '^matmul_bt_bench_run |' <<< "$output")" -eq 5
          summary="$(grep '^matmul_bt_bench_summary |' <<< "$output")"
          grep -q 'calls_per_iteration=13' <<< "$summary"
          grep -q 'add_calls_per_iteration=4' <<< "$summary"
          grep -q 'exact_output=true' <<< "$summary"
          grep -q 'repeats=5' <<< "$summary"

      - name: E2 attention forward benchmark
        shell: bash
        run: |
          output="$(cargo run --release --bin auralis_attention_bench -- 5 80 5 2>&1)"
          printf '%s\n' "$output"
          test "$(grep -c '^attention_bench_run |' <<< "$output")" -eq 5
          summary="$(grep '^attention_bench_summary |' <<< "$output")"
          grep -q 'calls_per_iteration=2' <<< "$summary"
          grep -q 'exact_output=true' <<< "$summary"
          grep -q 'repeats=5' <<< "$summary"

      - name: E2 attention backward benchmark
        shell: bash
        run: |
          output="$(cargo run --release --bin auralis_attention_backward_bench -- 5 80 5 2>&1)"
          printf '%s\n' "$output"
          test "$(grep -c '^attention_backward_bench_run |' <<< "$output")" -eq 5
          summary="$(grep '^attention_backward_bench_summary |' <<< "$output")"
          grep -q 'calls_per_iteration=2' <<< "$summary"
          grep -q 'exact_output=true' <<< "$summary"
          grep -q 'repeats=5' <<< "$summary"

      - name: E3 worker pool v2 evidence (temporary)
        shell: bash
        run: |
          cargo test --lib worker_pool::
          cargo run --release --bin auralis_worker_pool_v2_bench -- 3 20 5
