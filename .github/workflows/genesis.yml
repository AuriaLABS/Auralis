name: Genesis CI

on:
  push:
    branches:
      - main
      - 'auralis/**'
  pull_request:

permissions:
  contents: read

jobs:
  genesis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Unit tests
        run: cargo test --all-targets

      - name: Gradient check
        run: cargo run --release -- check

      - name: BPE roundtrip
        run: cargo run --release -- bpe

      - name: Training and checkpoint smoke test
        run: |
          cargo run --release -- train-fresh 3 /tmp/auralis-genesis.bin
          test -s /tmp/auralis-genesis.bin
          cargo run --release -- train 1 /tmp/auralis-genesis.bin
          cargo run --release -- eval /tmp/auralis-genesis.bin
