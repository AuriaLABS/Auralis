name: Auralis CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: auralis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AURALIS_COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Unit and acceptance tests
        run: cargo test --all-targets

      - name: Gradient check CLI
        shell: bash
        run: |
          output="$(cargo run --release -- check 2>&1)"
          printf '%s\n' "$output"
          grep -q 'ok=true' <<< "$output"

      - name: BPE roundtrip
        run: cargo run --release -- bpe

      - name: Training, accumulation, manifest and checkpoint smoke test
        shell: bash
        run: |
          output="$(cargo run --release -- train-fresh 3 /tmp/auralis-foundation.bin 659918 2 2 2>&1)"
          printf '%s\n' "$output"
          grep -q 'run_summary |' <<< "$output"
          grep -q 'effective_batch=4' <<< "$output"

          test -s /tmp/auralis-foundation.bin
          test -s /tmp/auralis-foundation.bin.manifest
          grep -q 'auralis_manifest=3' /tmp/auralis-foundation.bin.manifest
          grep -q "code_revision=${AURALIS_COMMIT_SHA}" /tmp/auralis-foundation.bin.manifest
          grep -q 'seed=659918' /tmp/auralis-foundation.bin.manifest
          grep -q 'batch_size=2' /tmp/auralis-foundation.bin.manifest
          grep -q 'gradient_accumulation_steps=2' /tmp/auralis-foundation.bin.manifest

          before="$(sha256sum /tmp/auralis-foundation.bin | cut -d' ' -f1)"
          if cargo run --release -- train 1 /tmp/auralis-foundation.bin 123 2 2; then
            echo 'resume with a different seed unexpectedly succeeded'
            exit 1
          fi
          after="$(sha256sum /tmp/auralis-foundation.bin | cut -d' ' -f1)"
          test "$before" = "$after"

          if cargo run --release -- train 1 /tmp/auralis-foundation.bin 659918 2 1; then
            echo 'resume with different accumulation unexpectedly succeeded'
            exit 1
          fi
          after_accum="$(sha256sum /tmp/auralis-foundation.bin | cut -d' ' -f1)"
          test "$before" = "$after_accum"

          cp /tmp/auralis-foundation.bin.manifest /tmp/auralis-foundation.saved.manifest
          rm /tmp/auralis-foundation.bin.manifest
          if cargo run --release -- train 1 /tmp/auralis-foundation.bin 659918 2 2; then
            echo 'resume without Foundation manifest unexpectedly succeeded'
            exit 1
          fi
          after_missing_manifest="$(sha256sum /tmp/auralis-foundation.bin | cut -d' ' -f1)"
          test "$before" = "$after_missing_manifest"
          mv /tmp/auralis-foundation.saved.manifest /tmp/auralis-foundation.bin.manifest

          cargo run --release -- train 1 /tmp/auralis-foundation.bin 659918 2 2
          test -s /tmp/auralis-foundation.bin.manifest
          cargo run --release -- eval /tmp/auralis-foundation.bin
