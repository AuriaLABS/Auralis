name: Release Generate

on:
  pull_request:
    paths:
      - "src/generate.rs"
      - "src/lib.rs"
      - "src/docs_check.rs"
      - "docs/generate.md"
      - "docs/versions.md"
      - ".github/workflows/release_generate.yml"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Generate contracts
        run: cargo test --lib generate::tests -- --nocapture

      - name: Documentation contract
        run: cargo test --lib docs_check::tests::generate_doc_matches_contract -- --nocapture

      - name: Full suite
        run: cargo test --lib
