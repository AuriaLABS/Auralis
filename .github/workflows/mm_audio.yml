name: Multimodal Audio Encoder

on:
  pull_request:
    paths:
      - "src/audio.rs"
      - "src/modality.rs"
      - "src/lib.rs"
      - "src/docs_check.rs"
      - "docs/audio.md"
      - "docs/versions.md"
      - ".github/workflows/mm_audio.yml"

permissions:
  contents: read

jobs:
  audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Audio contracts
        run: cargo test --lib audio::tests -- --nocapture

      - name: Documentation contract
        run: cargo test --lib docs_check::tests::audio_doc_matches_contract -- --nocapture

      - name: Full suite
        run: cargo test --lib
