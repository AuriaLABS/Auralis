name: Release post-tag

on:
  pull_request:
    paths:
      - "src/post_tag.rs"
      - "src/lib.rs"
      - "docs/post-tag.md"
      - "docs/versions.md"
      - "README.md"
      - ".github/workflows/release_post_tag.yml"

permissions:
  contents: read

jobs:
  post_tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Post-tag contracts
        run: cargo test --lib post_tag::tests -- --nocapture

      - name: Full suite
        run: cargo test --lib
