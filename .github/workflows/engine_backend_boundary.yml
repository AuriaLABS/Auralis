name: Engine Backend Boundary

on:
  pull_request:
    paths:
      - "src/backend.rs"
      - "src/lib.rs"
      - "src/bin/auralis_backend_boundary_bench.rs"
      - ".github/workflows/engine_backend_boundary.yml"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Boundary unit tests
        run: cargo test --lib backend::tests -- --nocapture

      - name: Dynamic boundary benchmark
        shell: bash
        run: |
          set -euo pipefail
          cargo run --release --bin auralis_backend_boundary_bench -- 5 200 7             | tee /tmp/backend-boundary.txt

          test "$(grep -c '^backend_boundary_run |' /tmp/backend-boundary.txt)" -eq 7
          test "$(grep -c '^backend_boundary_record |' /tmp/backend-boundary.txt)" -eq 2
          test "$(grep -c '^backend_boundary_comparison |' /tmp/backend-boundary.txt)" -eq 1
          summary="$(grep '^backend_boundary_summary |' /tmp/backend-boundary.txt)"
          grep -q 'exact=true' <<< "$summary"
          grep -q 'backend=cpu-row-slices' <<< "$summary"
          grep -q 'device=cpu' <<< "$summary"

          python3 - <<'PY'
          import json
          import re

          lines = open("/tmp/backend-boundary.txt", encoding="utf-8").read().splitlines()
          records = [
              json.loads(line.split(" | ", 1)[1])
              for line in lines
              if line.startswith("backend_boundary_record |")
          ]
          assert len(records) == 2
          assert records[0]["benchmark_id"] == records[1]["benchmark_id"]
          assert records[1]["backend"] == "cpu-row-slices"
          assert len(records[0]["raw_ns"]) == 7
          summary = next(line for line in lines if line.startswith("backend_boundary_summary |"))
          ratio = float(re.search(r"candidate_over_direct=([0-9.]+)", summary).group(1))
          if ratio > 1.20:
              raise SystemExit(f"backend boundary overhead too high: {ratio:.4f}")
          print(f"backend_boundary_gate | candidate_over_direct={ratio:.4f}")
          PY
