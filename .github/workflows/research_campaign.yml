name: Research Campaign Runner

on:
  pull_request:
    paths:
      - "src/campaign.rs"
      - "src/lib.rs"
      - "src/docs_check.rs"
      - "docs/campaign.md"
      - "docs/versions.md"
      - ".github/workflows/research_campaign.yml"

permissions:
  contents: read

jobs:
  campaign:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Campaign contracts
        run: cargo test --lib campaign::tests -- --nocapture

      - name: Documentation contract
        run: cargo test --lib docs_check::tests::campaign_doc_matches_contract -- --nocapture

      - name: Full suite
        run: cargo test --lib
