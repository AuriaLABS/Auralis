name: Multimodal Fusion

on:
  pull_request:
    paths:
      - "src/fusion.rs"
      - "src/modality.rs"
      - "src/vision.rs"
      - "src/lib.rs"
      - "src/docs_check.rs"
      - "docs/fusion.md"
      - "docs/versions.md"
      - ".github/workflows/mm_fusion.yml"

permissions:
  contents: read

jobs:
  fusion:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Fusion contracts
        run: cargo test --lib fusion::tests -- --nocapture

      - name: Documentation contract
        run: cargo test --lib docs_check::tests::fusion_doc_matches_contract -- --nocapture

      - name: Full suite
        run: cargo test --lib
