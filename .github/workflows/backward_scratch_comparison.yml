name: Backward Scratch Comparison

on:
  pull_request:
    paths:
      - "src/model.rs"
      - "src/bin/auralis_workspace_profile.rs"
      - ".github/workflows/backward_scratch_comparison.yml"
      - "scripts/backward_scratch_guard.py"

jobs:
  compare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Policy self-test
        run: python3 scripts/backward_scratch_guard.py --self-test

      - name: Compare base and candidate workspace profiles
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REQUIRE_IMPROVEMENT: ${{ contains(github.event.pull_request.body, 'Scratch-Optimization: true') }}
        shell: bash
        run: |
          set -euo pipefail

          git show "$HEAD_SHA:src/bin/auralis_workspace_profile.rs" > /tmp/auralis_workspace_profile.rs
          for i in 1 2 3; do
            git checkout --force "$BASE_SHA"
            cp /tmp/auralis_workspace_profile.rs src/bin/auralis_workspace_profile.rs
            cargo run --release --bin auralis_workspace_profile | tee "/tmp/base_${i}.txt"

            git checkout --force "$HEAD_SHA"
            cp /tmp/auralis_workspace_profile.rs src/bin/auralis_workspace_profile.rs
            cargo run --release --bin auralis_workspace_profile | tee "/tmp/candidate_${i}.txt"
          done

          python3 - <<'PY'
          import glob
          import os
          import re
          import statistics
          from scripts.backward_scratch_guard import evaluate_guard

          pattern = re.compile(
              r"workspace_profile \| phase=train_reuse block=32 seconds=([0-9.]+) "
              r"alloc_calls=(\d+) alloc_bytes=(\d+) realloc_calls=(\d+) realloc_new_bytes=(\d+) "
              r"dealloc_calls=(\d+) dealloc_bytes=(\d+) work_tokens=(\d+) "
              r"tok_per_s=([0-9.]+) peak_rss_kib=(\d+)"
          )

          def read(prefix):
              rows = []
              for path in sorted(glob.glob(f"/tmp/{prefix}_*.txt")):
                  text = open(path, encoding="utf-8").read()
                  match = pattern.search(text)
                  if not match:
                      raise SystemExit(f"missing train_reuse block=32 row in {path}")
                  (
                      seconds,
                      calls,
                      alloc_bytes,
                      reallocs,
                      realloc_bytes,
                      deallocs,
                      dealloc_bytes,
                      work_tokens,
                      tok_per_s,
                      peak_rss_kib,
                  ) = match.groups()
                  rows.append(
                      (
                          float(seconds),
                          int(calls),
                          int(alloc_bytes),
                          int(reallocs),
                          int(realloc_bytes),
                          int(deallocs),
                          int(dealloc_bytes),
                          int(work_tokens),
                          float(tok_per_s),
                          int(peak_rss_kib),
                      )
                  )
              if len(rows) != 3:
                  raise SystemExit(f"expected 3 rows for {prefix}, got {len(rows)}")
              return rows

          base = read("base")
          candidate = read("candidate")

          def stable_counter(rows, index, label):
              values = {row[index] for row in rows}
              if len(values) != 1:
                  raise SystemExit(f"{label} changed across repetitions: {sorted(values)}")
              return next(iter(values))

          base_calls = stable_counter(base, 1, "base alloc_calls")
          candidate_calls = stable_counter(candidate, 1, "candidate alloc_calls")
          base_bytes = stable_counter(base, 2, "base alloc_bytes")
          candidate_bytes = stable_counter(candidate, 2, "candidate alloc_bytes")
          base_reallocs = stable_counter(base, 3, "base realloc_calls")
          candidate_reallocs = stable_counter(candidate, 3, "candidate realloc_calls")
          base_realloc_bytes = stable_counter(base, 4, "base realloc_new_bytes")
          candidate_realloc_bytes = stable_counter(candidate, 4, "candidate realloc_new_bytes")
          base_work_tokens = stable_counter(base, 7, "base work_tokens")
          candidate_work_tokens = stable_counter(candidate, 7, "candidate work_tokens")
          if base_work_tokens != candidate_work_tokens:
              raise SystemExit(
                  f"base/candidate workload mismatch: {base_work_tokens} vs {candidate_work_tokens}"
              )

          base_s = statistics.median(row[0] for row in base)
          candidate_s = statistics.median(row[0] for row in candidate)
          base_tps = statistics.median(row[8] for row in base)
          candidate_tps = statistics.median(row[8] for row in candidate)
          base_rss = statistics.median(row[9] for row in base)
          candidate_rss = statistics.median(row[9] for row in candidate)
          speed_ratio = base_s / candidate_s if candidate_s else float("inf")
          throughput_ratio = candidate_tps / base_tps if base_tps else float("inf")
          rss_ratio = candidate_rss / base_rss if base_rss else float("inf")
          call_reduction = 1.0 - candidate_calls / base_calls
          byte_reduction = 1.0 - candidate_bytes / base_bytes
          require_improvement = os.environ.get("REQUIRE_IMPROVEMENT", "").lower() == "true"

          print(
              "backward_scratch_compare | "
              f"base_calls={base_calls} candidate_calls={candidate_calls} "
              f"call_reduction={call_reduction:.4%} "
              f"base_bytes={base_bytes} candidate_bytes={candidate_bytes} "
              f"byte_reduction={byte_reduction:.4%} "
              f"base_reallocs={base_reallocs} candidate_reallocs={candidate_reallocs} "
              f"base_realloc_bytes={base_realloc_bytes} "
              f"candidate_realloc_bytes={candidate_realloc_bytes} "
              f"work_tokens={base_work_tokens} "
              f"base_median_s={base_s:.9f} candidate_median_s={candidate_s:.9f} "
              f"speed_ratio={speed_ratio:.4f} "
              f"base_tok_per_s={base_tps:.3f} candidate_tok_per_s={candidate_tps:.3f} "
              f"throughput_ratio={throughput_ratio:.4f} "
              f"base_peak_rss_kib={base_rss:.0f} candidate_peak_rss_kib={candidate_rss:.0f} "
              f"rss_ratio={rss_ratio:.4f} "
              f"require_improvement={str(require_improvement).lower()}"
          )

          try:
              policy = evaluate_guard(
                  base_calls=base_calls,
                  candidate_calls=candidate_calls,
                  base_bytes=base_bytes,
                  candidate_bytes=candidate_bytes,
                  base_reallocs=base_reallocs,
                  candidate_reallocs=candidate_reallocs,
                  base_realloc_bytes=base_realloc_bytes,
                  candidate_realloc_bytes=candidate_realloc_bytes,
                  base_tps=base_tps,
                  candidate_tps=candidate_tps,
                  base_rss_kib=base_rss,
                  candidate_rss_kib=candidate_rss,
                  require_improvement=require_improvement,
              )
          except ValueError as exc:
              raise SystemExit(str(exc)) from exc

          print(f"backward_scratch_policy | result={policy}")
          PY
