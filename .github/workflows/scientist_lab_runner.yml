name: Scientist Lab Runner

on:
  pull_request:
    paths:
      - "src/lab_runner.rs"
      - "src/lab_registry.rs"
      - "src/lib.rs"
      - "src/docs_check.rs"
      - "docs/lab-runner.md"
      - "docs/versions.md"
      - ".github/workflows/scientist_lab_runner.yml"

permissions:
  contents: read

jobs:
  lab-runner:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Lab runner contracts
        run: cargo test --lib lab_runner::tests -- --nocapture

      - name: Documentation contract
        run: cargo test --lib docs_check::tests::lab_runner_doc_matches_contract -- --nocapture

      - name: Full suite
        run: cargo test --lib
