name: Multimodal Alignment

on:
  pull_request:
    paths:
      - "src/mm_align.rs"
      - "src/modality.rs"
      - "src/lib.rs"
      - "src/docs_check.rs"
      - "docs/mm-align.md"
      - "docs/versions.md"
      - ".github/workflows/mm_align.yml"

permissions:
  contents: read

jobs:
  align:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Alignment contracts
        run: cargo test --lib mm_align::tests -- --nocapture

      - name: Documentation contract
        run: cargo test --lib docs_check::tests::mm_align_doc_matches_contract -- --nocapture

      - name: Full suite
        run: cargo test --lib
