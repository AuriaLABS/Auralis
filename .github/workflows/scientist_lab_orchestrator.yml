name: Scientist Lab Orchestrator

on:
  pull_request:
    paths:
      - "src/lab_orchestrator.rs"
      - "src/lab_proposal.rs"
      - "src/lib.rs"
      - "src/docs_check.rs"
      - "docs/lab-orchestrator.md"
      - "docs/versions.md"
      - ".github/workflows/scientist_lab_orchestrator.yml"

permissions:
  contents: read

jobs:
  lab-orchestrator:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Lab orchestrator contracts
        run: cargo test --lib lab_orchestrator::tests -- --nocapture

      - name: Documentation contract
        run: cargo test --lib docs_check::tests::lab_orchestrator_doc_matches_contract -- --nocapture

      - name: Full suite
        run: cargo test --lib
