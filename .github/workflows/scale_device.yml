name: Scale Device Storage

on:
  pull_request:
    paths:
      - "src/device.rs"
      - "src/backend.rs"
      - "src/lib.rs"
      - "src/docs_check.rs"
      - "docs/device.md"
      - "docs/versions.md"
      - ".github/workflows/scale_device.yml"

permissions:
  contents: read

jobs:
  device:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Device contracts
        run: cargo test --lib device::tests -- --nocapture

      - name: Documentation contract
        run: cargo test --lib docs_check::tests::device_doc_matches_contract -- --nocapture

      - name: Full suite
        run: cargo test --lib
