name: Agent Planner

on:
  pull_request:
    paths:
      - "src/planner.rs"
      - "src/tool_registry.rs"
      - "src/agent_permissions.rs"
      - "src/tool_protocol.rs"
      - "src/lib.rs"
      - "docs/agent-planner.md"
      - "docs/versions.md"
      - ".github/workflows/agent_planner.yml"

permissions:
  contents: read

jobs:
  planner:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Planner contracts
        run: cargo test --lib planner::tests -- --nocapture
