name: Bench Result Parseability

on:
  pull_request:
    paths:
      - "src/bench_result.rs"
      - "src/bin/auralis_bench_result_smoke.rs"
      - ".github/workflows/bench_result_parseability.yml"

permissions:
  contents: read

jobs:
  parse:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Emit benchmark artifacts
        run: |
          rm -rf /tmp/bench-result-smoke
          cargo run --quiet --bin auralis_bench_result_smoke -- /tmp/bench-result-smoke
      - name: Parse JSON and CSV with Python stdlib
        run: |
          python3 - <<'PY'
          import csv, json
          from pathlib import Path

          root = Path("/tmp/bench-result-smoke")
          run = json.loads((root / "run.json").read_text())
          comp = json.loads((root / "comparison.json").read_text())
          with (root / "run.csv").open(newline="") as f:
              rows = list(csv.reader(f))

          assert run["benchmark_id"] == 'matmul,"tiny"\ncase'
          assert run["hardware"] == "cpu\rnode\x01"
          assert run["toolchain"] == "rustc\t1.98.1"
          assert run["raw_ns"] == [30, 10, 20]
          assert comp["benchmark_id"] == run["benchmark_id"]
          assert len(rows) == 2
          assert rows[1][0] == run["benchmark_id"]
          assert rows[1][2] == run["hardware"]
          assert rows[1][3] == run["toolchain"]
          assert rows[1][8] == "30;10;20"
          print("bench_result_parseability | json=ok csv=ok controls=ok")
          PY
