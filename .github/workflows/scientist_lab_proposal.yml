name: Scientist Lab Proposal

on:
  pull_request:
    paths:
      - "src/lab_proposal.rs"
      - "src/lab_registry.rs"
      - "src/lib.rs"
      - "src/docs_check.rs"
      - "docs/lab-proposal.md"
      - "docs/versions.md"
      - ".github/workflows/scientist_lab_proposal.yml"

permissions:
  contents: read

jobs:
  lab-proposal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Lab proposal contracts
        run: cargo test --lib lab_proposal::tests -- --nocapture

      - name: Documentation contract
        run: cargo test --lib docs_check::tests::lab_proposal_doc_matches_contract -- --nocapture

      - name: Full suite
        run: cargo test --lib
