name: Release packaging

on:
  pull_request:
    paths:
      - "src/packaging.rs"
      - "src/lib.rs"
      - "LICENSE"
      - "docs/packaging.md"
      - "docs/versions.md"
      - ".github/workflows/release_packaging.yml"

permissions:
  contents: read

jobs:
  packaging:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Packaging contracts
        run: cargo test --lib packaging::tests -- --nocapture

      - name: Full suite
        run: cargo test --lib
