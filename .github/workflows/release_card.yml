name: Release Model Card

on:
  pull_request:
    paths:
      - "src/card.rs"
      - "src/lib.rs"
      - "src/docs_check.rs"
      - "docs/model-card.md"
      - "docs/rc-metrics.md"
      - "docs/versions.md"
      - ".github/workflows/release_card.yml"

permissions:
  contents: read

jobs:
  card:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Documentation contract
        run: cargo test --lib docs_check::tests::rc_metrics_doc_matches_contract -- --nocapture

      - name: Full suite
        run: cargo test --lib
