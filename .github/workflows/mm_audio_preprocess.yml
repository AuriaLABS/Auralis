name: Multimodal Audio Preprocess

on:
  pull_request:
    paths:
      - "src/audio_preprocess.rs"
      - "src/audio.rs"
      - "src/lib.rs"
      - "src/docs_check.rs"
      - "docs/audio-preprocess.md"
      - "docs/versions.md"
      - ".github/workflows/mm_audio_preprocess.yml"

permissions:
  contents: read

jobs:
  audio-preprocess:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Audio preprocess contracts
        run: cargo test --lib audio_preprocess::tests -- --nocapture

      - name: Documentation contract
        run: cargo test --lib docs_check::tests::audio_preprocess_doc_matches_contract -- --nocapture

      - name: Full suite
        run: cargo test --lib
