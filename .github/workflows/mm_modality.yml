name: Multimodal Contract

on:
  pull_request:
    paths:
      - "src/modality.rs"
      - "src/lib.rs"
      - "src/docs_check.rs"
      - "docs/modality.md"
      - "docs/versions.md"
      - ".github/workflows/mm_modality.yml"

permissions:
  contents: read

jobs:
  modality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Modality contracts
        run: cargo test --lib modality::tests -- --nocapture

      - name: Documentation contract
        run: cargo test --lib docs_check::tests::modality_doc_matches_contract -- --nocapture

      - name: Full suite
        run: cargo test --lib
