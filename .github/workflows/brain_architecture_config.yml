name: Brain Architecture Config

on:
  pull_request:
    paths:
      - "src/architecture.rs"
      - "src/lib.rs"
      - "src/main.rs"
      - "src/docs_check.rs"
      - "docs/architecture-config.md"
      - "docs/cli.md"
      - "docs/versions.md"
      - "examples/architecture-*.cfg"
      - ".github/workflows/brain_architecture_config.yml"

permissions:
  contents: read

jobs:
  architecture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AURALIS_COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Contract tests
        run: |
          cargo test --lib architecture::tests -- --nocapture
          cargo test --lib docs_check::tests::architecture_config_docs_match_code -- --nocapture
          cargo test --bin auralis cli_tests -- --nocapture

      - name: Baseline default remains byte-identical
        shell: bash
        run: |
          set -euo pipefail
          cargo run --release -- train-fresh 2 /tmp/implicit.bin 659918 2 1             | tee /tmp/implicit.txt
          cargo run --release -- train-fresh 2 /tmp/explicit.bin 659918 2 1             --model-config examples/architecture-tiny.cfg             | tee /tmp/explicit.txt

          cmp /tmp/implicit.bin /tmp/explicit.bin
          cmp /tmp/implicit.bin.manifest /tmp/explicit.bin.manifest
          grep -q '^architecture | schema=1 n_embd=32 n_head=4 n_layer=2 block=32 n_ff=96 ' /tmp/implicit.txt
          grep -q '^architecture | schema=1 n_embd=32 n_head=4 n_layer=2 block=32 n_ff=96 ' /tmp/explicit.txt
          echo "brain_arch_baseline | checkpoint_exact=true manifest_exact=true"

      - name: Train one-layer one-head architecture
        shell: bash
        run: |
          set -euo pipefail
          cargo run --release -- train-fresh 2 /tmp/arch-1x1.bin 659918 2 1             --model-config examples/architecture-small-1x1.cfg             | tee /tmp/arch-1x1.txt
          grep -q '^architecture | schema=1 n_embd=8 n_head=1 n_layer=1 block=8 n_ff=16 ' /tmp/arch-1x1.txt
          grep -q '^n_embd=8$' /tmp/arch-1x1.bin.manifest
          grep -q '^n_head=1$' /tmp/arch-1x1.bin.manifest
          grep -q '^n_layer=1$' /tmp/arch-1x1.bin.manifest
          grep -q '^block=8$' /tmp/arch-1x1.bin.manifest
          grep -q '^n_ff=16$' /tmp/arch-1x1.bin.manifest

      - name: Train multi-layer multi-head architecture
        shell: bash
        run: |
          set -euo pipefail
          cargo run --release -- train-fresh 2 /tmp/arch-3x2.bin 659918 2 1             --model-config examples/architecture-small-3x2.cfg             | tee /tmp/arch-3x2.txt
          grep -q '^architecture | schema=1 n_embd=8 n_head=2 n_layer=3 block=8 n_ff=16 ' /tmp/arch-3x2.txt
          grep -q '^n_head=2$' /tmp/arch-3x2.bin.manifest
          grep -q '^n_layer=3$' /tmp/arch-3x2.bin.manifest
          test -s /tmp/arch-3x2.bin

      - name: Resume mismatch fails without overwrite
        shell: bash
        run: |
          set -euo pipefail
          before_ckpt="$(sha256sum /tmp/arch-1x1.bin | cut -d' ' -f1)"
          before_manifest="$(sha256sum /tmp/arch-1x1.bin.manifest | cut -d' ' -f1)"

          set +e
          cargo run --release -- train 1 /tmp/arch-1x1.bin 659918 2 1             --model-config examples/architecture-small-3x2.cfg             > /tmp/mismatch.txt 2>&1
          code=$?
          set -e

          test "$code" -eq 2
          grep -q 'architecture mismatch on resume' /tmp/mismatch.txt
          after_ckpt="$(sha256sum /tmp/arch-1x1.bin | cut -d' ' -f1)"
          after_manifest="$(sha256sum /tmp/arch-1x1.bin.manifest | cut -d' ' -f1)"
          test "$before_ckpt" = "$after_ckpt"
          test "$before_manifest" = "$after_manifest"
          echo "brain_arch_resume | mismatch_rejected=true checkpoint_unchanged=true manifest_unchanged=true"
