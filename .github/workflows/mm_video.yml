name: Multimodal Video Boundary

on:
  pull_request:
    paths:
      - "src/video.rs"
      - "src/vision.rs"
      - "src/modality.rs"
      - "src/lib.rs"
      - "src/docs_check.rs"
      - "docs/video.md"
      - "docs/versions.md"
      - ".github/workflows/mm_video.yml"

permissions:
  contents: read

jobs:
  video:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Video contracts
        run: cargo test --lib video::tests -- --nocapture

      - name: Documentation contract
        run: cargo test --lib docs_check::tests::video_doc_matches_contract -- --nocapture

      - name: Full suite
        run: cargo test --lib
