name: Multimodal Collator

on:
  pull_request:
    paths:
      - "src/mm_collator.rs"
      - "src/modality.rs"
      - "src/lib.rs"
      - "src/docs_check.rs"
      - "docs/mm-collator.md"
      - "docs/versions.md"
      - ".github/workflows/mm_collator.yml"

permissions:
  contents: read

jobs:
  collator:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Collator contracts
        run: cargo test --lib mm_collator::tests -- --nocapture

      - name: Documentation contract
        run: cargo test --lib docs_check::tests::mm_collator_doc_matches_contract -- --nocapture

      - name: Full suite
        run: cargo test --lib
