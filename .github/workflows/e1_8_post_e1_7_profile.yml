name: E1.8 Workspace Profile Post-E1.7

on:
  pull_request:
    paths:
      - "src/model.rs"
      - "src/bin/auralis_workspace_profile.rs"
      - ".github/workflows/e1_8_post_e1_7_profile.yml"

jobs:
  profile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Workspace profile
        run: cargo run --release --bin auralis_workspace_profile
