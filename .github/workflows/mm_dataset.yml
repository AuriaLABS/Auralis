name: Multimodal Dataset Pipeline

on:
  pull_request:
    paths:
      - "src/mm_dataset.rs"
      - "src/lib.rs"
      - "src/docs_check.rs"
      - "docs/mm-dataset.md"
      - "docs/versions.md"
      - ".github/workflows/mm_dataset.yml"

permissions:
  contents: read

jobs:
  mm-dataset:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Multimodal dataset contracts
        run: cargo test --lib mm_dataset::tests -- --nocapture

      - name: Documentation contract
        run: cargo test --lib docs_check::tests::mm_dataset_doc_matches_contract -- --nocapture

      - name: Full suite
        run: cargo test --lib
