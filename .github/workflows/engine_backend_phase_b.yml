name: Engine Backend Phase B

on:
  pull_request:
    paths:
      - "src/model.rs"
      - "src/backend.rs"
      - "src/run_config.rs"
      - "src/checkpoint.rs"
      - ".github/workflows/engine_backend_phase_b.yml"

permissions:
  contents: read

jobs:
  model-backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Model backend exactness
        run: |
          cargo test --lib model::tests::cpu_backends_are_exact_for_logits_and_loss_across_contexts -- --nocapture
          cargo test --test engine_equivalence -- --nocapture
          cargo test --test engine_state_equivalence -- --nocapture

      - name: Persistent schema must stay untouched
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- src/run_config.rs src/checkpoint.rs; then
            echo "Phase B must not change RunConfig/checkpoint schemas"
            git diff "$BASE_SHA" "$HEAD_SHA" -- src/run_config.rs src/checkpoint.rs
            exit 1
          fi

      - name: Build base and head profiler binaries
        shell: bash
        run: |
          set -euo pipefail

          git checkout --detach "$BASE_SHA"
          cargo build --release --bin auralis_eval_profile --bin auralis_engine_soak
          cp target/release/auralis_eval_profile /tmp/backend-base-eval
          cp target/release/auralis_engine_soak /tmp/backend-base-soak

          git checkout --detach "$HEAD_SHA"
          cargo build --release --bin auralis_eval_profile --bin auralis_engine_soak
          cp target/release/auralis_eval_profile /tmp/backend-head-eval
          cp target/release/auralis_engine_soak /tmp/backend-head-soak

      - name: Alternating eval profile measurements
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/backend-base-eval.txt
          : > /tmp/backend-head-eval.txt

          for rep in 1 2 3 4 5; do
            if (( rep % 2 == 1 )); then
              /tmp/backend-base-eval 80 >> /tmp/backend-base-eval.txt
              /tmp/backend-head-eval 80 >> /tmp/backend-head-eval.txt
            else
              /tmp/backend-head-eval 80 >> /tmp/backend-head-eval.txt
              /tmp/backend-base-eval 80 >> /tmp/backend-base-eval.txt
            fi
          done

          test "$(grep -c '^eval_profile | mode=loss ' /tmp/backend-base-eval.txt)" -eq 5
          test "$(grep -c '^eval_profile | mode=loss ' /tmp/backend-head-eval.txt)" -eq 5
          test "$(grep -c '^eval_profile | mode=generate_one ' /tmp/backend-base-eval.txt)" -eq 5
          test "$(grep -c '^eval_profile | mode=generate_one ' /tmp/backend-head-eval.txt)" -eq 5

      - name: Base/head training fingerprints
        shell: bash
        run: |
          set -euo pipefail
          /tmp/backend-base-soak 20 10 | tee /tmp/backend-base-soak.txt
          /tmp/backend-head-soak 20 10 | tee /tmp/backend-head-soak.txt
          test "$(grep -c '^engine_soak_summary |' /tmp/backend-base-soak.txt)" -eq 1
          test "$(grep -c '^engine_soak_summary |' /tmp/backend-head-soak.txt)" -eq 1

      - name: Compare pre-boundary and Phase B
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import statistics

          def kv(line):
              out = {}
              for token in line.split():
                  if "=" in token:
                      k, v = token.split("=", 1)
                      out[k] = v
              return out

          def profiles(path):
              rows = {"loss": [], "generate_one": []}
              for line in open(path, encoding="utf-8"):
                  if line.startswith("eval_profile |"):
                      row = kv(line)
                      rows[row["mode"]].append(row)
              return rows

          base = profiles("/tmp/backend-base-eval.txt")
          head = profiles("/tmp/backend-head-eval.txt")

          for mode in ["loss", "generate_one"]:
              assert len(base[mode]) == 5 and len(head[mode]) == 5
              for rows, name in [(base[mode], "base"), (head[mode], "head")]:
                  alloc_signatures = {
                      (
                          r["alloc_calls"],
                          r["alloc_bytes"],
                          r["realloc_calls"],
                          r["realloc_new_bytes"],
                      )
                      for r in rows
                  }
                  if len(alloc_signatures) != 1:
                      raise SystemExit(f"{mode} {name} allocation counts are unstable: {alloc_signatures}")

              base_sig = (
                  base[mode][0]["alloc_calls"],
                  base[mode][0]["alloc_bytes"],
                  base[mode][0]["realloc_calls"],
                  base[mode][0]["realloc_new_bytes"],
              )
              head_sig = (
                  head[mode][0]["alloc_calls"],
                  head[mode][0]["alloc_bytes"],
                  head[mode][0]["realloc_calls"],
                  head[mode][0]["realloc_new_bytes"],
              )
              if base_sig != head_sig:
                  raise SystemExit(
                      f"{mode} allocation regression: base={base_sig} head={head_sig}"
                  )

              base_seconds = [float(r["seconds"]) for r in base[mode]]
              head_seconds = [float(r["seconds"]) for r in head[mode]]
              base_med = statistics.median(base_seconds)
              head_med = statistics.median(head_seconds)
              ratio = head_med / base_med
              if ratio > 1.10:
                  raise SystemExit(
                      f"{mode} median model backend overhead too high: head/base={ratio:.4f}"
                  )
              print(
                  f"backend_model_eval_gate | mode={mode} "
                  f"base_median_s={base_med:.6f} head_median_s={head_med:.6f} "
                  f"median_ratio={ratio:.4f} alloc_calls={head_sig[0]} "
                  f"alloc_bytes={head_sig[1]}"
              )

          def soak(path):
              line = next(
                  line for line in open(path, encoding="utf-8")
                  if line.startswith("engine_soak_summary |")
              )
              return kv(line)

          sb = soak("/tmp/backend-base-soak.txt")
          sh = soak("/tmp/backend-head-soak.txt")
          for row, name in [(sb, "base"), (sh, "head")]:
              if row["exact_state"] != "true" or row["checkpoint_bytes_exact"] != "true":
                  raise SystemExit(f"{name} soak lost internal exactness")
              if row["finite_loss"] != "true":
                  raise SystemExit(f"{name} soak has non-finite loss")

          for field in ["continuous_fingerprint", "split_fingerprint"]:
              if sb[field] != sh[field]:
                  raise SystemExit(
                      f"training state changed across backend integration: "
                      f"{field} base={sb[field]} head={sh[field]}"
                  )

          print(
              "backend_model_state_gate | "
              f"continuous_fingerprint={sh['continuous_fingerprint']} "
              f"split_fingerprint={sh['split_fingerprint']} exact=true"
          )
          PY

      - name: Publish comparison summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Engine backend Phase B"
            echo
            echo "### Base eval profile"
            cat /tmp/backend-base-eval.txt 2>/dev/null || true
            echo
            echo "### Head eval profile"
            cat /tmp/backend-head-eval.txt 2>/dev/null || true
            echo
            grep '^engine_soak_summary |' /tmp/backend-base-soak.txt 2>/dev/null || true
            grep '^engine_soak_summary |' /tmp/backend-head-soak.txt 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
